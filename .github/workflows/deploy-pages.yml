name: Deploy article to GitHub Pages

# Статья (site/) — Vite+React на @rk/ui. Зависимость @dmitrymake/rk-ui
# вендорится в site/vendor/rk-ui.tgz (самодостаточно для CI).

on:
  workflow_run:
    workflows: ["CI (release integrity)"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # workflow_run has a privileged token. Only build a successful push to the
    # current main tip, never a PR checkout or a stale certified revision.
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_sha == github.sha
      }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run gen
      - run: npm run build
      - run: node ../scripts/check-provenance.mjs
      - run: git -C .. diff --exit-code -- site/src/generated
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

name: Deploy article to GitHub Pages

# Статья (site/) — Vite+React на @rk/ui. Зависимость @dmitrymake/rk-ui
# вендорится в site/vendor/rk-ui.tgz (самодостаточно для CI).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/gen-site-data.mjs"
      - "scripts/check-provenance.mjs"
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run gen
      - run: npm run build
      - run: node ../scripts/check-provenance.mjs
      - run: git -C .. diff --exit-code -- site/src/generated
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

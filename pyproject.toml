[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stylo"
version = "0.4.0"
description = "Reproducible Russian-prose authorship-attribution framework with fail-closed scientific gates"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dmitry Purtov" }]

# Core dependency ranges describe package compatibility. The supported
# reproducible core/dev install uses requirements.lock as an exact constraints
# file and verifies its path-free distribution fingerprint before bound runs.
# The spaCy Russian model
# `ru_core_news_lg==3.8.0` must be installed separately:
#   python -m spacy download ru_core_news_lg
dependencies = [
    "spacy>=3.8,<3.9",
    "click>=8.0",
    "scikit-learn>=1.7,<1.8",
    "numpy>=2.0",
    "scipy>=1.16",
    "pandas>=2.0",
    "joblib>=1.5",
    "pyyaml>=6.0",
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
# Neural contextual embeddings (ruBERT). Heavy; only needed for the
# topic-controlled embedding experiment (features/embeddings.py).
embeddings = [
    "torch>=2.0",
    "transformers>=4.50",
    "sentence-transformers>=5.0",
]
viz = [
    "umap-learn>=0.5.9,<0.6",
]
dev = ["pytest>=8.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
stylo = "stylo.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stylo.resources" = ["*.json", "*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
